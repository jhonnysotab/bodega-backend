spring.application.name=bodegas
# =============================================
# BASE DE DATOS MYSQL
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3307/pos_bodegas?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# JPA / HIBERNATE
# =============================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# =============================================
# JWT
# =============================================
# ?? Cambia esto en producción - mínimo 32 caracteres
jwt.secret=pos_bodegas_clave_super_segura_2024_cambiar
jwt.expiration=86400000
# 86400000 ms = 24 horas

# =============================================
# SERVIDOR
# =============================================
server.port=8080