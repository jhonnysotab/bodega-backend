spring.application.name=bodegas
# =============================================
# BASE DE DATOS MYSQL
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3306/pos_bodegas?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# JPA / HIBERNATE
# =============================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# =============================================
# JWT
# =============================================
# Cambia esto en produccion - minimo 32 caracteres
jwt.secret=pos_bodegas_clave_super_segura_2024_cambiar
jwt.expiration=86400000
# 86400000 ms = 24 horas

# =============================================
# SERVIDOR
# =============================================
server.port=8080

# Tamaño máximo para subir fotos de facturas/vouchers
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =============================================
# CLAUDE (importación de productos desde imagen)
# =============================================
# Pega tu API key aquí, o mejor, exporta la variable de entorno ANTHROPIC_API_KEY
# y deja esta línea como está (${ANTHROPIC_API_KEY:} usa el env var si existe, si no queda vacío).
# Se consigue en https://console.anthropic.com/settings/keys
anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.api.model=claude-sonnet-5
